# Development stack on Emeruth (~/compose/pbooth-dev): test code and mock data, never real events.
# Separate from production (project "pbooth"): own database, own photo storage, nothing shared.
#   tools/dev-stack.sh     sends this checkout to Emeruth, builds it there and starts it
# Reachable only on the tailnet, through Emeruth's Traefik (allowed sources: Tailscale addresses):
#   https://pbooth-dev.ts.solcredio.net        the app (admin, kiosk, galleries)
#   https://pbooth-dev-s3.ts.solcredio.net     its photo storage (signed links point here)
# Ports are published on 127.0.0.1 only, for Traefik.
name: pbooth-dev

services:
  app:
    image: pbooth:dev
    build: { context: ./src, args: { PBOOTH_VERSION: development } }
    restart: unless-stopped
    labels: { wud.watch: "false", com.centurylinklabs.watchtower.enable: "false" }
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://postgres:test@db:5432/test
      APP_ORIGIN: https://pbooth-dev.ts.solcredio.net
      TRUST_PROXY_HOPS: "1"
      ALLOW_SIMULATED_BOOTHS: "true"
      S3_ENDPOINT: https://pbooth-dev-s3.ts.solcredio.net
      S3_BUCKET: pbooth-dev
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-} # from ~/compose/pbooth-dev/.env; use a bot of its own
    ports: ["127.0.0.1:3021:3000"]
    networks: [dev]
    mem_limit: 768m
    cpus: 1
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    labels: { wud.watch: "false", com.centurylinklabs.watchtower.enable: "false" }
    environment: { POSTGRES_PASSWORD: test, POSTGRES_DB: test } # mock data on a private network, no published port
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d test"], interval: 10s, timeout: 5s, retries: 6 }
    networks: [dev]
    mem_limit: 256m
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -dir=/data -master.volumeSizeLimitMB=256
    # newer SeaweedFS refuses unknown keys: this test key is its admin (mock storage on a private network)
    environment: { AWS_ACCESS_KEY_ID: test, AWS_SECRET_ACCESS_KEY: test }
    restart: unless-stopped
    labels: { wud.watch: "false", com.centurylinklabs.watchtower.enable: "false" }
    volumes: [s3data:/data]
    ports: ["127.0.0.1:8334:8333"]
    networks: [dev]
    mem_limit: 512m
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

volumes:
  pgdata:
  s3data:

networks:
  dev:
    # Emeruth has no automatic address ranges left: a fixed one
    ipam: { config: [{ subnet: 10.251.21.0/24 }] }
