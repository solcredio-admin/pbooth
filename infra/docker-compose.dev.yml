# Local development database only (the apps run on your machine with hot reload).
#   docker compose -f infra/docker-compose.dev.yml up -d
name: pbooth-dev
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: pbooth, POSTGRES_PASSWORD: pbooth, POSTGRES_DB: pbooth }
    ports: ["127.0.0.1:5432:5432"]   # localhost only
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pbooth"], interval: 5s, retries: 10 }
volumes:
  pgdata:
