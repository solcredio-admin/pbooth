name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && corepack prepare pnpm@10.34.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @pbooth/api build
      - name: S3-compatible store for the photo tests (SeaweedFS)
        run: |
          docker run -d -p 8333:8333 chrislusf/seaweedfs:latest server -s3 -dir=/data -master.volumeSizeLimitMB=512
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8333/ && exit 0; sleep 2; done; echo "storage didn't start"; exit 1
      - name: PostgreSQL 17 client tools for the backup/restore test
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
      - name: API unit + integration tests
        run: pnpm --filter @pbooth/api test
        env: { TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/test", TEST_S3_ENDPOINT: "http://localhost:8333" }
      - run: pnpm --filter @pbooth/web build
      - name: Agent unit tests
        run: pnpm --filter @pbooth/agent test
      - name: Agent with real gPhoto2 + CUPS (virtual PDF printer)
        run: |
          docker build -t pbooth-agent-hwtest -f apps/agent/test/hardware.Dockerfile apps/agent/test
          docker run --rm -v "$PWD":/src:ro pbooth-agent-hwtest sh /src/apps/agent/test/hardware.sh

  image:
    # Publishes ghcr.io/<owner>/pbooth on every push to main, after the tests pass.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PBOOTH_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pbooth:latest
            ghcr.io/${{ github.repository_owner }}/pbooth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
