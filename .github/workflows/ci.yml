name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable && corepack prepare pnpm@10.34.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @pbooth/api build
      - name: API unit + integration tests
        run: pnpm --filter @pbooth/api test
        env: { TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/test" }
      - run: pnpm --filter @pbooth/web build

  image:
    # Publishes ghcr.io/<owner>/pbooth on every push to main, after the tests pass.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PBOOTH_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pbooth:latest
            ghcr.io/${{ github.repository_owner }}/pbooth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
